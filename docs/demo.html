<script src="../dist/ha-appliance-card.js"></script>
<div id="wrap"><div class="row" id="row"></div></div>
<script>
// Two views out of one file:
//   ?view=hero   four cards, the image at the top of the README
//   ?view=types  the whole range, one card per appliance type
// plus ?lang=fr for the French screenshots.
const params = new URLSearchParams(location.search);
// A captured GIF loads the page once per frame. Left to chance, the microwave
// would warm another dish and the printer print another part on every frame:
// with ?phase= (or ?seed=) the dice give the same throws on every load.
if (params.has("phase") || params.has("seed")) {
  let seed = Number(params.get("seed")) || 7;
  Math.random = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

const view = ["types", "live"].includes(params.get("view")) ? params.get("view") : "hero";
// Twenty-nine types, the two other feeders and a ceiling fan, thirty-two
// cards with the iron on its steam generator: eight across and four down.
document.documentElement.style.setProperty("--cols", params.get("cols") || 8);
// ?cw= narrows the cards for the README grids, where a drawing alone would
// otherwise sit in a mostly empty 300 px card.

  document.documentElement.style.setProperty("--gap", params.get("gap") !== null ? `${Number(params.get("gap"))}px` : "12px");

// ?poster=1: the README's opening picture, every drawing with its name alone,
// packed tight like a poster.
const poster = params.get("poster") === "1";
let posterName = null;
let posterModels = 0;
let posterSize = 0;
const fr = uiLang === "fr";
const L = (en, f) => (fr ? f : en);

  return { entity_id, state: String(state), attributes: attributes || {} };
}

}

// The plug-only view: every appliance that can be read from a smart plug,

// what it draws at work. The visitor moves the power to see the card follow.

// plug: it knows each type's threshold, its steps and its phases.
const PLUG_WATTS = { washer: 1900, dryer: 2000, dishwasher: 1800, oven: 2400, microwave: 900, kettle: 2200, coffee: 1200, cooker: 800,
  rice_cooker: 500, air_fryer: 1500, toaster: 900, iron: 2200, fridge: 70, water_heater: 2000, space_heater: 1500, towel_warmer: 600,
  dehumidifier: 250, air_purifier: 30, fan: 35, hood: 120, screen: 120, hair_dryer: 1200, printer_3d: 200, pool_pump: 750, robot: 24,
  cooktop: 2600, food_processor: 500, pet_fountain: 2, water_pump: 800, floor_heating: 1200, spa: 2000, sauna: 6000, aquarium: 60, christmas_tree: 20, pellet_grill: 45,
  humidifier: 25, filament_dryer: 60, mobility: 150, irrigation: 6, litter_box: 10, speaker: 8, console: 120, streamer: 6 };
const PLUG_MAX = { washer: 2400, dryer: 2800, dishwasher: 2200, oven: 3500, microwave: 1300, kettle: 2400, coffee: 1500, cooker: 1200,
  rice_cooker: 800, air_fryer: 2000, toaster: 1200, iron: 2600, fridge: 200, water_heater: 3000, space_heater: 2000, towel_warmer: 1000,
  dehumidifier: 400, air_purifier: 80, fan: 80, hood: 300, screen: 250, hair_dryer: 2200, printer_3d: 400, pool_pump: 1500, robot: 60,
  cooktop: 7200, food_processor: 1200, pet_fountain: 5, water_pump: 1500, floor_heating: 2500, spa: 3000, sauna: 9000, aquarium: 150, christmas_tree: 50, pellet_grill: 400,
  humidifier: 50, filament_dryer: 120, mobility: 600, irrigation: 15, litter_box: 40, speaker: 40, console: 250, streamer: 15 };
const plugOnly = params.get("plug") === "1";
// ?color= draws every card of the live gallery in one illustration colour.
const demoColor = ["white", "grey", "black", "red"].includes(params.get("color")) ? params.get("color") : "";
// ?bd= the background behind the drawings: the gallery shows "state"
// (illustration_backdrop: state), ?bd=none the card as it comes, ?bd=neutral.
const demoBackdrop = ["none", "neutral", "state"].includes(params.get("bd")) ? params.get("bd") : "state";
const backdropOf = (config) => (demoBackdrop === "none" || config.illustration_backdrop ? {} : { illustration_backdrop: demoBackdrop });
const plugSeen = new Set();

// those cards and no other (plugFamily).

  const seen = [type, ...Object.keys(config).filter((k) => /_layout$|^printer_style$|^spool_count$/.test(k)).sort().map((k) => k + "=" + config[k])].join("/");

// The live demo lets a visitor change what each card reads: a slider for a

const ON_OFF_DOMAINS = ["binary_sensor", "switch", "input_boolean", "light", "fan", "humidifier", "lock"];

  media_player: ["playing", "paused", "idle", "on", "standby", "off"],
  device_tracker: ["home", "not_home"],
  ups: ["OL", "OL CHRG", "OB DISCHRG", "OB DISCHRG LB", "OL RB", "OL BYPASS", "OFF"],
  floor_washer: ["idle", "in_operation", "self_cleaning"],

const TYPE_WORDS = { washer: CYCLE_WORDS, dryer: CYCLE_WORDS, dishwasher: CYCLE_WORDS, oven: ["Idle", "Preheating", "Running", "Finished"],

  if (domain === "water_heater" && Array.isArray(a.operation_list)) return a.operation_list;
  if (Array.isArray(a.options)) return a.options;
  if (STATE_WORDS[domain]) return STATE_WORDS[domain];

  if (u === "s") return [0, Math.max(3600, v * 2), 30];
  if (u === "min") return [0, Math.max(120, v * 2), 1];
  if (u === "w" || u === "kw" || u === "mbit/s") { const hi = Math.max(u === "kw" ? 10 : 100, Math.abs(v) * 3); return [v < 0 ? -hi : 0, hi, u === "kw" ? 0.1 : 1]; }
  const hi = Math.max(10, Math.abs(v) * 3);
  return [v < 0 ? -hi : 0, hi, Math.abs(v) < 10 && v % 1 ? 0.1 : 1];
}
// Values with a known scale but no unit: a percentage, a hob level, a blender
// speed, signal bars. Without this their slider would run to three times the
// current value.
const KNOWN_RANGES = [
  [/progress$/, [0, 100, 1]],
  [/^sensor\.hob_z\d$/, [0, 9, 1]],
  [/^sensor\.cooker_speed$/, [0, 10, 1]],
  [/\.signal_strength$/, [0, 5, 1]],
];
let editorN = 0;
function valueEditor(cell, sim) {
  const { config, states } = sim;
  const box = document.createElement("details");
  box.className = "values";
  box.innerHTML = `<summary>${L("Change the values", "Modifier les valeurs")}</summary>`;
  const list = document.createElement("div");
  box.appendChild(list);
  cell.appendChild(box);
  // A typed value only redraws the card; a pressed button also redraws the
  // list, so the field shows what the button wrote.
  let typing = false;
  const set = (id, value, attr) => { typing = true; sim.set(id, value, attr); typing = false; };
  const toast = document.createElement("div");
  toast.className = "sim";
  cell.insertBefore(toast, box);
  let toastT;
  sim.note = (what) => {
    toast.textContent = `${L("Pressed", "Appui")} : ${String(what).replace(/_/g, " ")}`;
    toast.classList.add("on");
    clearTimeout(toastT);
    toastT = setTimeout(() => toast.classList.remove("on"), 1800);
  };
  sim.refresh = () => { if (!typing) build(); };
  const field = (label, id, value, unit, attr, words, attrs) => {
    const row = document.createElement("label");
    row.className = "val";
    const name = `<span>${label}</span>`;
    const domain = id.split(".")[0];
    const n = Number(value);
    if (!attr && ON_OFF_DOMAINS.includes(domain) && ["on", "off"].includes(String(value))) {
      row.innerHTML = `${name}<input type="checkbox"${value === "on" ? " checked" : ""}>`;
      row.querySelector("input").addEventListener("change", (e) => set(id, e.target.checked ? "on" : "off"));
    } else if (String(value).trim() !== "" && Number.isFinite(n) && !words.length) {
      // A number entity carries its own bounds: use them rather than a guess.
      const own = attrs && Number.isFinite(Number(attrs.min)) && Number.isFinite(Number(attrs.max));
      const known = KNOWN_RANGES.find(([re]) => re.test(attr ? `${id}.${attr}` : id));
      const [lo, hi, step] = known ? known[1] : own ? [Number(attrs.min), Number(attrs.max), Number(attrs.step) || 1] : rangeFor(n, unit);
      row.innerHTML = `${name}<input type="range" min="${lo}" max="${hi}" step="${step}" value="${n}"><input type="number" step="${step}" value="${n}"><em>${unit || ""}</em>`;
      const [r, num] = row.querySelectorAll("input");
      r.addEventListener("input", () => { num.value = r.value; set(id, r.value, attr); });
      num.addEventListener("change", () => { r.value = num.value; set(id, num.value, attr); });
    } else {
      const dl = `dl${editorN++}`;
      const opts = [...new Set([...words, String(value), "unavailable"])];
      row.innerHTML = `${name}<input list="${dl}" value="${String(value).replace(/"/g, "&quot;")}"><datalist id="${dl}">${opts.map((o) => `<option value="${String(o).replace(/"/g, "&quot;")}">`).join("")}</datalist>`;
      const inp = row.querySelector("input");
      // A word picked from the list is applied at once and the field let go,
      // so the next click opens the whole list again.
      const pick = () => { if (!inp.value) return; inp.dataset.was = inp.value; set(id, inp.value, attr); inp.blur(); };
      inp.addEventListener("change", pick);
      inp.addEventListener("input", () => { if (opts.map(String).includes(inp.value)) pick(); });
      inp.addEventListener("focus", () => { inp.dataset.was = inp.value; inp.value = ""; });
      inp.addEventListener("blur", () => { if (!inp.value) inp.value = inp.dataset.was || ""; });
    }
    list.appendChild(row);
  };
  const build = () => {
  list.innerHTML = "";
  for (const [id, st] of Object.entries(states)) {
    if (["button", "script", "scene"].includes(id.split(".")[0])) continue;
    const short = id.split(".")[1].replace(/_/g, " ");
    field(short, id, st.state, st.attributes && st.attributes.unit_of_measurement, null, wordsFor(id, st, config), st.attributes);
    for (const [k, v] of Object.entries(st.attributes || {})) {
      if (["unit_of_measurement", "friendly_name", "device_class", "icon", "options", "entity_picture", "supported_features"].includes(k) || Array.isArray(v) || typeof v === "object") continue;
      const listed = st.attributes[`${k}s`] || st.attributes[`${k.replace(/_mode$/, "")}_modes`];
      if (typeof v === "number") field(`${short} \u00b7 ${k.replace(/_/g, " ")}`, id, v, k.includes("temperature") ? "\u00b0C" : /battery|percent|humidity|position/.test(k) ? "%" : "", k, []);
      else if (Array.isArray(listed)) field(`${short} \u00b7 ${k.replace(/_/g, " ")}`, id, v, "", k, listed);
      else if (["hvac_action", "status"].includes(k)) field(`${short} \u00b7 ${k.replace(/_/g, " ")}`, id, v, "", k,
        k === "hvac_action" ? ["heating", "cooling", "drying", "fan", "idle", "off", "defrosting", "preheating"] : []);
    }
  }
  };
  build();
}

      // Counted without drawing; a family with nothing on a plug is left out.
      plugDry = true; plugCount = 0; plugRecord = new Set();
      makers.forEach((f) => f());
      keys = plugRecord;
      plugDry = false; plugRecord = null;
      if (!plugCount) { sec.remove(); return; }
      sec.querySelector("small").textContent = plugCount;
    }

      if (sec.dataset.built) return;
      sec.dataset.built = "1";
      row = grid;
      plugFamily = keys;
      makers.forEach((f) => f());
      plugFamily = null;
    };

    // cards built at once froze the page for long seconds.
    if (newOnly || n === 0 || !wrap.querySelector("details[open]")) { sec.open = true; build(); }

  // A card redraws once its language has loaded, which starts every
  // animation over: the phase is set again after that, or a French frame
  // would show the start of the loop whatever its phase.
  const freeze = () => {
    for (const el of row.children) {
      if (!el.shadowRoot) continue;
      for (const a of el.shadowRoot.getAnimations()) {
        a.pause();
        a.currentTime = Number(phase);

  };

  requestAnimationFrame(freeze);
