name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Card behaviour tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: for f in src/*.js tools/*.mjs test/*.mjs; do node --check "$f"; done
      - name: dist/ is what the source builds
        run: node tools/build.mjs --check
      - name: Behaviour tests
        run: node test/run.mjs
      - name: Release as split
        run: node test/split.mjs
      - name: Release draws what the source draws
        run: node test/equiv.mjs
