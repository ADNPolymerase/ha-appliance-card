name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Card behaviour tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check dist/ha-appliance-card.js
      - name: Behaviour tests
        run: node test/run.mjs
